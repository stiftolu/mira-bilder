# Postet Miras Instagram-Plan alle 15 Minuten (Zeiten in UTC; das Programm rechnet selbst in Berliner Zeit).
name: Mira posten
on:
  schedule:
    - cron: "*/15 4-22 * * *"
  workflow_dispatch:
concurrency:
  group: mira-posten
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Posten
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python posten_cloud.py
      - name: Stand sichern
        if: always()
        run: |
          git config user.name "Mira Planer"
          git config user.email "stiftolu@users.noreply.github.com"
          git add gepostet.json
          git diff --cached --quiet || (git commit -m "Stand $(date -u +%F_%H%M)" && git push)
